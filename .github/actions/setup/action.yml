name: Setup
description: Installs Nix with its store cache (zeabur-oss/.github) and kache with its cache, which only main saves.
runs:
  using: composite
  steps:
    - uses: zeabur-oss/.github/actions/ci-setup@b3c4f65ae9d5a247760345474a52da9bd2391296 # main
    - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        save-cache: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        pr-comment: false
