name: Setup
description: Installs Nix and restores Cargo's build output for the dev shell's Rust toolchain.
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
    # rust-cache keys on `rustc -vV`, so use the dev shell's toolchain.
    - shell: bash
      run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
