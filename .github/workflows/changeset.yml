name: Changeset

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A title edit, a label and a push in a row leave only the last run.
concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    uses: zeabur-oss/.github/.github/workflows/changeset.yml@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
