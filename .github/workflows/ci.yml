name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally. Pull requests and
# pushes run lint and test. The merge queue runs every job on the commit about to land, and the
# nightly run keeps main's caches for the merge queue's jobs.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# A job that can run on Instabox takes its runner from a variable, such as instabox-small: lint from
# CI_RUNNER_LINT, the ubuntu-slim jobs from CI_RUNNER_SLIM, the others from CI_RUNNER. Without the
# variable it runs on GitHub's runner. The jobs that need Docker, k3d or kind stay there.
jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/lint.sh

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/test.sh

  kubernetes:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/kubernetes.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  zizmor:
    uses: zeabur-oss/.github/.github/workflows/zizmor.yml@c43a5d36ad39f938de24e0b59109c82a20f6265a # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, kubernetes, zizmor]
    runs-on: ${{ vars.CI_RUNNER_SLIM || 'ubuntu-slim' }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
