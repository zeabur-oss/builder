name: CI

# Every job of `scripts/ci.sh --list`, as `scripts/ci.sh <job>`, and the DCO check, in the shared
# workflows of zeabur-oss/.github. The jobs themselves live in scripts/ci.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@3d106187b96a11dcc2b1c3024c95400a074de1a1 # main
    with:
      rust-cache: true
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@3d106187b96a11dcc2b1c3024c95400a074de1a1 # main
