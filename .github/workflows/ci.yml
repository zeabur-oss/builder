name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally. Pull requests and
# pushes run lint and test. The merge queue runs every job on the commit about to land, and the
# nightly run keeps main's caches for the merge queue's jobs. Only main saves the kache cache;
# every other ref restores it.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@3e2ad056ac86367fa15350f105b81621032e91f6 # ci/ci-setup-kache
        with:
          rust-cache: true
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo

  test:
    runs-on: instabox-small
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@3e2ad056ac86367fa15350f105b81621032e91f6 # ci/ci-setup-kache
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/test.sh

  kubernetes:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: instabox-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@3e2ad056ac86367fa15350f105b81621032e91f6 # ci/ci-setup-kache
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/kubernetes.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, kubernetes]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
