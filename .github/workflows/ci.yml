name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally. Pull requests and
# pushes run lint and test. The merge queue runs every job on the commit about to land, and the
# nightly run keeps main's caches for the merge queue's jobs.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The kache cache in S3 (prefix kache/). Only a push to main writes it. The repository secrets
  # hold a read-only key; the cache-write environment, which only main may deploy to, holds a write
  # key under the same names. A pull request, even one that edits this file, never sees that key.
  # kache's own rule (write only on a protected branch) runs in the job, so it cannot stop code
  # that bypasses it.
  KACHE_S3_BUCKET: ${{ vars.CACHE_S3_BUCKET }}
  KACHE_S3_REGION: ${{ vars.CACHE_S3_REGION }}
  KACHE_S3_ENDPOINT: ${{ vars.CACHE_S3_ENDPOINT }}

jobs:
  lint:
    runs-on: instabox-small
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo
      - if: always()
        run: nix develop -c kache daemon stop

  test:
    runs-on: instabox-small
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c scripts/ci/test.sh
      - if: always()
        run: nix develop -c kache daemon stop

  kubernetes:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: instabox-large
    timeout-minutes: 45
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c scripts/ci/kubernetes.sh
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
      - if: always()
        run: nix develop -c kache daemon stop
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, kubernetes]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Every commit of a pull request carries `Signed-off-by:` with its author's name and email.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "::error::commit $sha has no 'Signed-off-by: $author' (git commit -s)"
              status=1
            fi
          done
          exit $status
