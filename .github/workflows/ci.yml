name: CI

# Every job of `scripts/ci.sh --list`, as `scripts/ci.sh <job>`, and the DCO check, in the shared
# workflows of zeabur-oss/.github. The jobs themselves live in scripts/ci.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@9f67bcbecd22239636877a838d7359278a0e765e # main
    with:
      rust-cache: true
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@9f67bcbecd22239636877a838d7359278a0e765e # main
