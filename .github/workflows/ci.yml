name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally, except docs, which
# runs the website's check of docs/ (locally: bun scripts/docs-check.ts <this checkout> in the
# website). Pull requests and pushes run lint, test and docs. The merge queue runs every job on the commit about to land, and the
# nightly run keeps main's caches for the merge queue's jobs. Only main saves the kache cache;
# every other ref restores it.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - name: Test
        run: nix develop -c scripts/ci/test.sh

  kubernetes:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    # A GitHub runner: Instabox machines do not enforce the NetworkPolicy that the isolation
    # checks test.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - parallel:
          - name: Test on Kubernetes
            run: nix develop -c scripts/ci/kubernetes.sh
            env:
              CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
          - name: Trial builds on buildkitd
            run: nix develop -c scripts/ci/trial-builds.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    runs-on: instabox-small
    timeout-minutes: 10
    steps:
      - uses: zeabur-oss/website/.github/actions/docs-check@2e35930439db8ffcf686c95abef945087697a9ec # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, kubernetes, docs]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
