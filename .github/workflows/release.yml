name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release builds, publishes and signs the
# images and chart, then
# leaves the assets on the draft the tag job made. Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: zeabur-oss/.github/.github/workflows/release-build.yml@3e2e5ba4210b60c1e97fa53e2029e1ea9f5e468e # main
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
  release:
    if: github.event_name == 'push' # a rehearsal never publishes
    needs: build
    uses: zeabur-oss/.github/.github/workflows/release.yml@3e2e5ba4210b60c1e97fa53e2029e1ea9f5e468e # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.build.outputs.version }}
      platforms: ${{ needs.build.outputs.platforms }}
