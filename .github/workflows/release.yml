name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release builds, publishes and signs the
# images and chart, then
# leaves a draft. Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@cd8171d0dc9923e3ab495f4eb35815c90e40d4e8 # ci/release-shell
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Builder
      docs: https://oss.zeabur.com/docs/builder/
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
