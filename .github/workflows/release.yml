name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build and smoke the images on both architectures,
# push them and the chart by digest, sign and attest them, create the draft release with the
# assets, and verify the draft. A maintainer publishes the draft. Manual run: rehearse, which
# builds and smokes and publishes nothing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: instabox-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: The version is the crate's and the chart's, with a CHANGELOG.md section, on main
        run: |
          crate=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "zeabur-builder") | .version')
          chart=$(sed -n 's/^version: *//p' deploy/chart/Chart.yaml)
          bun x zeabur-oss-release check-tag "$VERSION" --changelog CHANGELOG.md \
            --version "$crate" --version "$chart" ${{ github.event_name != 'push' && '--rehearsal' || '' }}

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Build the three images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # mkShell sets SOURCE_DATE_EPOCH to 1980; the commit's time replaces it.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/build-images.sh zeabur-builder "release-$ARCH"
          mkdir dist
          for image in builder builder-job builder-railpack; do
            docker image save --output "dist/$image.tar" "zeabur-builder/$image:release-$ARCH"
          done
      - name: Smoke the images, with the chart of this commit, on k3s
        env:
          ZEABUR_CI_IMAGE_TAG: release-${{ matrix.arch }}
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: scripts/ci/kubernetes.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # images and the chart on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          path: images
      - id: publish
        name: Push the images and the chart by digest and sign them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          plain=${VERSION#v}
          release() { bun x zeabur-oss-release "$@"; }
          # image <name> <chart value that pins it>: the index of both architectures, signed,
          # pinned by digest in the chart.
          image() {
            release push-image --out published --label "$1" --pin "chart/values.yaml:$2" \
              "ghcr.io/$owner/$1:$plain" \
              "linux/amd64=images/images-amd64/$1.tar" "linux/arm64=images/images-arm64/$1.tar"
          }

          release unpublished "$VERSION"
          crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          # Every tag is refused before the first push, so a release never stops halfway on a tag
          # that was there from the start.
          release absent "ghcr.io/$owner/builder:$plain" "ghcr.io/$owner/builder-job:$plain" \
            "ghcr.io/$owner/builder-railpack:$plain" "ghcr.io/$owner/charts/zeabur-builder:$plain"

          cp -r deploy/chart chart
          image builder image
          image builder-job jobImage
          image builder-railpack railpackImage
          helm lint --strict chart --set registry.host=registry.example:5000
          helm package chart --destination published
          release push-chart --out published "oci://ghcr.io/$owner/charts" "published/zeabur-builder-$plain.tgz"
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }}@${{ matrix.digest }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: instabox-small
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  release:
    needs: [publish, attest]
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: published
      - name: Make the release assets
        run: |
          mkdir assets
          cp "published/zeabur-builder-${VERSION#v}.tgz" published/digests.txt assets/
      - uses: zeabur-oss/.github/actions/release-draft@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          version: ${{ env.VERSION }}
          name: Zeabur Builder
          docs: https://oss.zeabur.com/docs/builder/

  verify:
    needs: release
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - uses: zeabur-oss/.github/actions/release-verify@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          version: ${{ env.VERSION }}
      - name: Verify the images and the chart
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ env.VERSION }}
        run: |
          release() { bun x zeabur-oss-release "$@"; }
          chart=downloaded/zeabur-builder-${VERSION#v}.tgz
          # An image of the draft: signed, attested, in both architectures, and the one the chart
          # installs by default.
          image() {
            release verify-image --digests downloaded/digests.txt --label "$1" \
              --chart "$chart" --key "$2" linux/amd64 linux/arm64
          }

          # A fresh, empty registry login: a publisher's login must not hide a private package.
          export DOCKER_CONFIG=$RUNNER_TEMP/docker HELM_REGISTRY_CONFIG=$RUNNER_TEMP/docker/config.json
          mkdir -p "$DOCKER_CONFIG"
          image builder image
          image builder-job jobImage
          image builder-railpack railpackImage
          release verify-chart --digests downloaded/digests.txt "$chart"
          helm template builder "$chart" --set registry.host=registry.example:5000 \
            --set registry.tokenSecretRef.namespace=zot --set registry.tokenSecretRef.name=zot-token-signer >/dev/null
