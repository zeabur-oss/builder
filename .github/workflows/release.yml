name: Release

# A tag vX.Y.Z on a commit of main runs the shared release workflow of
# zeabur-oss/.github: it builds the three images on each architecture, smokes them on k3s,
# publishes them and the chart by digest, signs and attests them, and leaves a draft release that a
# maintainer checks and publishes. Run by hand, it rehearses: the builds and their smoke tests, nothing published.
# With verify_only it checks an existing draft again with this commit's scripts. The stages are
# scripts/release.sh.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@0badbf68744c7690d1b5b613071044bc12b002be # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Builder
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
