name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release builds, publishes and signs the
# images and chart, then
# leaves a draft. Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@594f6faaa5ffa5283585e5fe46122a3526c27d08 # ci/release-shell
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Builder
      docs: https://oss.zeabur.com/docs/builder/
      version: ${{ inputs.version }}
