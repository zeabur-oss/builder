name: Release

# A tag vX.Y.Z runs all of CI on its commit, then the shared release workflow of zeabur-oss/.github:
# it builds the three images on each architecture, smokes them on k3s, publishes them and the chart
# by digest, signs and attests them, and leaves a draft release that a maintainer checks and
# publishes. Run by hand, it rehearses: CI, the builds and their smoke tests, nothing published.
# With verify_only it checks an existing draft again with this commit's scripts. The stages are
# scripts/release.sh.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole of CI on this commit, the cluster job included.
  checks:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || inputs.verify_only) }}
    uses: zeabur-oss/.github/.github/workflows/release.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur Builder
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
