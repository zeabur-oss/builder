name: Update

# Moves every pin of zeabur-oss/.github to its main and copies the shared skills again from
# that commit, in one pull request: Monday 02:30 in Asia/Taipei, or by hand.
on:
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: zeabur-oss/.github/.github/workflows/update.yml@322a53bbe1ab1a1e1cea8102781069aa094492dc # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
