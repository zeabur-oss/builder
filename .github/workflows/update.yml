name: Update

# Moves every pin of zeabur-oss/.github to its main in one pull request: Monday 02:30 in
# Asia/Taipei, or by hand.
on:
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: zeabur-oss/.github/.github/workflows/update.yml@b3c4f65ae9d5a247760345474a52da9bd2391296 # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
