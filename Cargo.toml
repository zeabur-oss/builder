[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2-beta.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.metadata.levels]
# A crate may depend only on crates of a lower level (scripts/check-levels.sh).
zeabur-builder-core = 0
zeabur-builder-api = 1
zeabur-builder-jobspec = 2
zeabur-builder = 3
zeabur-builder-job = 3

[workspace.metadata.pure]
# No I/O, no clock, no randomness: the controller's decisions are functions of their inputs.
crates = ["zeabur-builder-core", "zeabur-builder-api", "zeabur-builder-jobspec"]

[workspace.dependencies]
# Workspace crates, levelled from the bottom up.
zeabur-builder-core = { path = "crates/zeabur-builder-core" }
zeabur-builder-api = { path = "crates/zeabur-builder-api" }
zeabur-builder-jobspec = { path = "crates/zeabur-builder-jobspec" }

# Third-party crates.
# HMAC for webhook signatures and RS256 for GitHub App JWTs, from the backend rustls already uses.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
base64 = "0.23"
bytes = "1"
# The decompressor of archive sources, in pure Rust.
flate2 = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "aws-lc-rs", "tls12", "logging"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "server", "http1", "tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_34"] }
kube = { version = "4.2", default-features = false, features = ["derive"] }
# Leader election with a `coordination.k8s.io` Lease.
kube-lease-manager = "0.12"
pretty_assertions = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
rustls-native-certs = "0.8.5"
# SSH for resolving refs of `git@` remotes; aws-lc-rs as for rustls, no RSA.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for the pure crates, which hold no C library.
sha2 = { version = "0.11", default-features = false }
# Reads the tar entries of archive sources; the Job writes the files itself.
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

# Lint policy (see CONTRIBUTING.md), shared with Zeabur Identity.
# Everything is `warn` so work in progress still compiles; CI runs with `-D warnings`.

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# cargo-deny tracks duplicate versions.
multiple_crate_versions = "allow"
# Contradicts rustc's `unreachable_pub`, which we keep: items are `pub(crate)` unless exported.
redundant_pub_crate = "allow"

# Selected `restriction` lints.
# The controller reads webhook payloads and Git refs it does not control: no panics on input.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
wildcard_enum_match_arm = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
unused_result_ok = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_inherent_impl = "warn"
partial_pub_fields = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
verbose_file_reads = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
