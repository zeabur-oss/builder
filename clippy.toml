# Clippy configuration. Lint levels live in Cargo.toml [workspace.lints].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false

# Proper nouns that doc_markdown would otherwise ask to wrap in backticks.
doc-valid-idents = ["BuildKit", "GitHub", "GitOps", "OpenAI", "OpenAPI", "OpenRouter", "Railpack", ".."]

# Read and build a known shape through a typed struct: a `k8s_openapi` type, or a local struct with
# `#[derive(Deserialize)]`. Only data of any shape is read through `serde_json::Value`.
disallowed-types = [
  { path = "serde_json::Value", reason = "deserialize into a k8s_openapi type or a local struct with #[derive(Deserialize)]" },
  { path = "kube::core::DynamicObject", reason = "use the k8s_openapi type, or a local struct through Api<T> or kube::core::Object" },
]
# A value inferred from an untyped API, such as `serde_json::to_value`, is not caught by the type.
disallowed-methods = [
  { path = "serde_json::Value::get", reason = "deserialize into a typed struct" },
  { path = "serde_json::Value::get_mut", reason = "deserialize into a typed struct" },
  { path = "serde_json::Value::pointer", reason = "deserialize into a typed struct" },
  { path = "serde_json::Value::pointer_mut", reason = "deserialize into a typed struct" },
  { path = "serde_json::Value::as_object_mut", reason = "build a typed struct and serialize it" },
  { path = "serde_json::Value::as_array_mut", reason = "build a typed struct and serialize it" },
  # Writes go through crates/zeabur-builder/src/write.rs, so runs that write one object at once agree.
  { path = "kube::Api::create", reason = "use write::apply, or write::create_once for an object made once" },
  { path = "kube::Api::replace", reason = "use write::apply, or write::replace_at with the resourceVersion read" },
  { path = "tokio::time::sleep", reason = "retry with a backon builder, or wait on a watch" },
]
