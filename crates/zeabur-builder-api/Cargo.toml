[package]
name = "zeabur-builder-api"
description = "Zeabur Builder: the builder.zeabur.com custom resources and their admission rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
repository = "https://github.com/zeabur-oss/builder"
readme = false
keywords = ["kubernetes", "buildkit"]
categories = ["development-tools::build-utils"]

[lints]
workspace = true

[features]
default = ["schema"]
# `JsonSchema` for every type and the CRDs, for the controller and the CRD generator.
schema = ["dep:schemars", "kube/derive"]

[dependencies]
k8s-openapi.workspace = true
kube.workspace = true
kube-derive.workspace = true
schemars = { workspace = true, optional = true }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
