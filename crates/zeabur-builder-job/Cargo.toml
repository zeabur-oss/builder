[package]
name = "zeabur-builder-job"
description = "Zeabur Builder: runs buildctl in the build Job and reports the result to the controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/zeabur-oss/builder"
readme = false
keywords = ["kubernetes", "buildkit"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
zeabur-builder-core.workspace = true
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
jiff.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }
