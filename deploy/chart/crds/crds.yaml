                      "Pending",
                      "Planning",
                      "Building",
                      "Succeeded",
                      "Failed",
                      "Cancelled"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "phaseDurations": {
                    "additionalProperties": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "description": "Time per phase (`fetch`, `plan`, `build`, `push`), as durations such as `82.0s`.",
                    "maxProperties": 8,
                    "type": "object"
                  },
                  "planDigest": {
                    "description": "The plan used.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^sha256:[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "planSource": {
                    "description": "Where a plan came from.",
                    "enum": [
                      "generated",
                      "none"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "reason": {
                    "description": "Why a `BuildRun` waits or failed.",
                    "enum": [
                      "QuotaExceeded",
                      "BuildkitdStarting",
                      "RegistryCredentialsMissing",
                      "SourceFailed",
                      "PlanFailed",
                      "BuildFailed",
                      "OutOfMemory",
                      "Timeout",
                      "Cancelled",
                      "InfraError"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "startTime": {
                    "description": "When the Job was created.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
                  "tags": {
                    "description": "The tags pushed.",
                    "items": {
                      "maxLength": 128,
                      "type": "string"
                    },
                    "maxItems": 16,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "BuildRun",
            "type": "object"
          }
        },
        "selectableFields": [
          {
            "jsonPath": ".spec.buildRef"
          },
          {
            "jsonPath": ".status.phase"
          }
        ],
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
