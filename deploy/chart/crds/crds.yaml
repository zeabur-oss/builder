---
{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "clusterbuilders.builder.zeabur.com"
  },
  "spec": {
    "group": "builder.zeabur.com",
    "names": {
      "categories": [
        "zeabur-builder"
      ],
      "kind": "ClusterBuilder",
      "plural": "clusterbuilders",
      "shortNames": [
        "cbuilder"
      ],
      "singular": "clusterbuilder"
    },
    "scope": "Cluster",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.type",
            "name": "Type",
            "type": "string"
          },
          {
            "jsonPath": ".spec.frontend.type",
            "name": "Frontend",
            "type": "string"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "How Zeabur Builder plans and builds: Dockerfile or Railpack.",
            "properties": {
              "spec": {
                "description": "A way to build. Every builder reduces to the same shape: an optional planner that writes files\ninto `/workspace/plan`, then a `BuildKit` frontend with options that reads them.",
                "properties": {
                  "frontend": {
                    "description": "The frontend that builds the plan.",
                    "properties": {
                      "opts": {
                        "additionalProperties": {
                          "maxLength": 4096,
                          "type": "string"
                        },
                        "description": "Frontend options added to every build, as `buildctl --opt key=value`.",
                        "maxProperties": 32,
                        "type": "object"
                      },
                      "source": {
                        "description": "The frontend image for `gateway.v0`, such as\n`ghcr.io/railwayapp/railpack-frontend:v0.43.0`. It must match the planner's version.",
                        "maxLength": 512,
                        "nullable": true,
                        "type": "string"
                      },
                      "type": {
                        "description": "`dockerfile.v0` (built into buildkitd) or `gateway.v0` (an image).",
                        "enum": [
                          "dockerfile.v0",
                          "gateway.v0"
                        ],
                        "type": "string"
                      }
                    },
                    "required": [
                      "type"
                    ],
                    "type": "object",
                    "x-kubernetes-validations": [
                      {
                        "message": "source is required for gateway.v0 and forbidden for dockerfile.v0",
                        "rule": "self.type == 'gateway.v0' ? has(self.source) && self.source != '' : !has(self.source)"
                      }
                    ]
                  },
                  "planner": {
                    "description": "The planner; absent when the builder needs no plan.",
                    "nullable": true,
                    "properties": {
                      "image": {
                        "description": "The planner image, pinned by digest in production.",
                        "maxLength": 512,
                        "minLength": 1,
                        "type": "string"
                      },
                      "resources": {
                        "description": "CPU and memory for the plan container.",
                        "nullable": true,
                        "properties": {
                          "limits": {
                            "description": "Limits.",
                            "nullable": true,
                            "properties": {
                              "cpu": {
                                "description": "CPU, such as `500m`.",
                                "maxLength": 32,
                                "nullable": true,
                                "type": "string"
                              },
                              "memory": {
                                "description": "Memory, such as `1Gi`.",
                                "maxLength": 32,
                                "nullable": true,
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "requests": {
                            "description": "Requests.",
                            "nullable": true,
                            "properties": {
                              "cpu": {
                                "description": "CPU, such as `500m`.",
                                "maxLength": 32,
                                "nullable": true,
                                "type": "string"
                              },
                              "memory": {
                                "description": "Memory, such as `1Gi`.",
                                "maxLength": 32,
                                "nullable": true,
                                "type": "string"
                              }
                            },
                            "type": "object"
                          }
                        },
                        "type": "object"
                      },
                      "timeout": {
                        "description": "How long planning may take. Default `10m`.",
                        "maxLength": 32,
                        "nullable": true,
                        "pattern": "^([0-9]{1,6}(\\.[0-9]{1,3})?(ms|s|m|h))+$",
                        "type": "string"
                      }
                    },
                    "required": [
                      "image"
                    ],
                    "type": "object"
                  },
                  "type": {
                    "description": "What the planning step does.",
                    "enum": [
                      "dockerfile",
                      "railpack"
                    ],
                    "type": "string"
                  }
                },
                "required": [
                  "frontend",
                  "type"
                ],
                "type": "object",
                "x-kubernetes-validations": [
                  {
                    "message": "planner is required for railpack, and forbidden for dockerfile",
                    "rule": "self.type == 'dockerfile' ? !has(self.planner) : has(self.planner)"
                  }
                ]
              }
            },
            "required": [
              "spec"
            ],
            "title": "ClusterBuilder",
            "type": "object"
          }
        },
        "served": true,
        "storage": true
      }
    ]
  }
}
---
{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "builds.builder.zeabur.com"
  },
  "spec": {
    "group": "builder.zeabur.com",
    "names": {
      "categories": [
        "zeabur-builder"
      ],
      "kind": "Build",
      "plural": "builds",
      "shortNames": [
        "zbbuild"
      ],
      "singular": "build"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.builderRef",
            "name": "Builder",
            "type": "string"
          },
          {
            "jsonPath": ".status.sourceMode",
            "name": "Source",
            "type": "string"
          },
          {
            "jsonPath": ".status.latestRevision",
            "name": "Revision",
            "type": "string"
          },
          {
            "jsonPath": ".status.conditions[?(@.type==\"Ready\")].status",
            "name": "Ready",
            "type": "string"
          },
          {
            "jsonPath": ".status.latestImage",
            "name": "Image",
            "priority": 1,
            "type": "string"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "A Git ref or an uploaded archive that Zeabur Builder keeps built into a container image.",
            "properties": {
              "spec": {
                "description": "A Git ref to follow, or an uploaded archive, and the image to keep built from it.\n\n```yaml\napiVersion: builder.zeabur.com/v1alpha1\nkind: Build\nmetadata: {name: api, namespace: team-a}\nspec:\n  source: {git: {url: https://github.com/acme/api, ref: main}}\n  builderRef: railpack\n```",
                "properties": {
                  "builderRef": {
                    "description": "The `ClusterBuilder`.",
                    "maxLength": 253,
                    "minLength": 1,
                    "type": "string"
                  },
                  "concurrency": {
                    "default": "Replace",
                    "description": "What a new commit does to a running build.",
                    "enum": [
                      "Replace",
                      "Queue"
                    ],
                    "type": "string"
                  },
                  "env": {
                    "description": "Build variables, always passed as `BuildKit` secrets, never as build arguments.",
                    "items": {
                      "description": "A build variable.",
                      "properties": {
                        "name": {
                          "description": "The name, as the build sees it.",
                          "maxLength": 128,
                          "minLength": 1,
                          "pattern": "^[A-Za-z_][A-Za-z0-9_]*$",
                          "type": "string"
                        },
                        "value": {
                          "description": "A literal value.",
                          "maxLength": 32768,
                          "nullable": true,
                          "type": "string"
                        },
                        "valueFrom": {
                          "description": "A value from a Secret in the same namespace.",
                          "nullable": true,
                          "properties": {
                            "secretKeyRef": {
                              "description": "A key of a Secret.",
                              "properties": {
                                "key": {
                                  "description": "The key.",
                                  "maxLength": 253,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "name": {
                                  "description": "The Secret's name.",
                                  "maxLength": 253,
                                  "minLength": 1,
                                  "type": "string"
                                }
                              },
                              "required": [
                                "key",
                                "name"
                              ],
                              "type": "object"
                            }
                          },
                          "required": [
                            "secretKeyRef"
                          ],
                          "type": "object"
                        }
                      },
                      "required": [
                        "name"
                      ],
                      "type": "object",
                      "x-kubernetes-validations": [
                        {
                          "message": "set exactly one of value and valueFrom",
                          "rule": "has(self.value) != has(self.valueFrom)"
                        }
                      ]
                    },
                    "maxItems": 128,
                    "type": "array"
                  },
                  "historyLimit": {
                    "description": "Finished `BuildRun`s to keep. The newest success is always kept. Default 10.",
                    "format": "int32",
                    "maximum": 100.0,
                    "minimum": 1.0,
                    "nullable": true,
                    "type": "integer"
                  },
                  "notify": {
                    "description": "Who to tell after a successful build.",
                    "items": {
                      "description": "A notification after a successful build.",
                      "properties": {
                        "secretRef": {
                          "description": "A token or HMAC key.",
                          "nullable": true,
                          "properties": {
                            "name": {
                              "description": "The Secret's name.",
                              "maxLength": 253,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": [
                            "name"
                          ],
                          "type": "object"
                        },
                        "type": {
                          "description": "The receiver.",
                          "enum": [
                            "keel"
                          ],
                          "type": "string"
                        },
                        "url": {
                          "description": "Where to POST.",
                          "maxLength": 2048,
                          "minLength": 1,
                          "pattern": "^https?://",
                          "type": "string"
                        }
                      },
                      "required": [
                        "type",
                        "url"
                      ],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "output": {
                    "description": "Where to push. Default: `<defaultRegistry>/<namespace>/<name>`.",
                    "nullable": true,
                    "properties": {
                      "extraTags": {
                        "description": "Fixed tags pushed as well, such as `latest`. Rollout tools should not rely on them.",
                        "items": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$",
                          "type": "string"
                        },
                        "maxItems": 8,
                        "type": "array"
                      },
                      "image": {
                        "description": "The image repository, without a tag.",
                        "maxLength": 512,
                        "nullable": true,
                        "pattern": "^[a-z0-9]([a-z0-9._:/-]*[a-z0-9])?$",
                        "type": "string"
                      },
                      "pushSecretRef": {
                        "description": "Push credentials for an image outside the default registry: a\n`kubernetes.io/dockerconfigjson` Secret in the same namespace, labelled\n`builder.zeabur.com/push-credentials: \"true\"`. The default registry gets a token\ninstead.",
                        "nullable": true,
                        "properties": {
                          "name": {
                            "description": "The Secret's name.",
                            "maxLength": 253,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": [
                          "name"
                        ],
                        "type": "object"
                      },
                      "tagTemplate": {
                        "description": "The tag: `{{.Field}}` with `.Branch`, `.ShortSHA`, `.SHA`, `.UnixTime` and `.BuildRun`.\nDefault `{{.Branch}}-{{.UnixTime}}-{{.ShortSHA}}`.",
                        "maxLength": 256,
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "source": {
                    "description": "Where the source comes from.",
                    "properties": {
                      "archive": {
                        "description": "An archive pushed as an OCI artifact to `<registry>/<namespace>/<name>/source`\n(`docs/builds/archive-source.mdx`).",
                        "nullable": true,
                        "properties": {
                          "contextDir": {
                            "description": "The build context inside the archive.",
                            "maxLength": 1024,
                            "nullable": true,
                            "pattern": "^[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)*$",
                            "type": "string"
                          },
                          "digest": {
                            "description": "The artifact's manifest digest. Unset: the `Build` waits for an upload.",
                            "maxLength": 71,
                            "nullable": true,
                            "pattern": "^sha256:[0-9a-f]{64}$",
                            "type": "string"
                          },
                          "dockerfile": {
                            "description": "The Dockerfile, relative to the context, for the `dockerfile` builder. Default\n`Dockerfile`.",
                            "maxLength": 1024,
                            "nullable": true,
                            "pattern": "^[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)*$",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "credentialsRef": {
                        "description": "Credentials for a plain Git server: a `kubernetes.io/ssh-auth` Secret (with `known_hosts`)\nor a `kubernetes.io/basic-auth` one, labelled `builder.zeabur.com/git-credentials: \"true\"`.",
                        "nullable": true,
                        "properties": {
                          "name": {
                            "description": "The Secret's name.",
                            "maxLength": 253,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": [
                          "name"
                        ],
                        "type": "object"
                      },
                      "git": {
                        "description": "The Git repository.",
                        "nullable": true,
                        "properties": {
                          "contextDir": {
                            "description": "The build context inside the repository, for monorepos.",
                            "maxLength": 1024,
                            "nullable": true,
                            "pattern": "^[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)*$",
                            "type": "string"
                          },
                          "dockerfile": {
                            "description": "The Dockerfile, relative to the context, for the `dockerfile` builder. Default\n`Dockerfile`.",
                            "maxLength": 1024,
                            "nullable": true,
                            "pattern": "^[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)*$",
                            "type": "string"
                          },
                          "ref": {
                            "default": "HEAD",
                            "description": "A branch or tag; no wildcards. Default `HEAD`: the repository's default branch, which is\nresolved again on every poll, so a renamed default branch is followed.",
                            "maxLength": 255,
                            "minLength": 1,
                            "type": "string"
                          },
                          "url": {
                            "description": "`https://`, `ssh://` or `user@host:path`.",
                            "maxLength": 2048,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": [
                          "url"
                        ],
                        "type": "object"
                      },
                      "githubApp": {
                        "description": "Reach the repository through an installation of the cluster's GitHub App, which a cluster\nadmin has allowed for this namespace.",
                        "nullable": true,
                        "properties": {
                          "installationId": {
                            "description": "The installation's id, from `https://github.com/settings/installations/<id>`.",
                            "format": "int64",
                            "minimum": 1.0,
                            "type": "integer"
                          }
                        },
                        "required": [
                          "installationId"
                        ],
                        "type": "object"
                      }
                    },
                    "type": "object",
                    "x-kubernetes-validations": [
                      {
                        "message": "set exactly one of git and archive",
                        "rule": "has(self.git) != has(self.archive)"
                      },
                      {
                        "message": "credentialsRef and githubApp need a git source",
                        "rule": "has(self.git) || !(has(self.credentialsRef) || has(self.githubApp))"
                      },
                      {
                        "message": "set at most one of credentialsRef and githubApp",
                        "rule": "!(has(self.credentialsRef) && has(self.githubApp))"
                      },
                      {
                        "message": "a githubApp source needs an https URL",
                        "rule": "!has(self.githubApp) || (has(self.git) && self.git.url.startsWith('https://'))"
                      }
                    ]
                  },
                  "suspend": {
                    "description": "Stop automatic builds. `BuildRun`s created by hand still run.",
                    "type": "boolean"
                  },
                  "triggers": {
                    "default": {},
                    "description": "What starts a build.",
                    "properties": {
                      "pollInterval": {
                        "description": "How often to check the ref. Default `1m`; `10m`, as a safety net, for a `githubApp`\nsource when the controller receives webhooks.",
                        "maxLength": 32,
                        "nullable": true,
                        "pattern": "^([0-9]{1,6}(\\.[0-9]{1,3})?(ms|s|m|h))+$",
                        "type": "string"
                      },
                      "webhook": {
                        "description": "Push events from a repository webhook, signed with a secret this `Build` names. A\n`githubApp` source also wakes on the App's push events, without this.",
                        "nullable": true,
                        "properties": {
                          "secretRef": {
                            "description": "The shared secret, in a Secret in the same namespace: the webhook's secret on GitHub,\nGitea, Forgejo and Bitbucket, its secret token or signing token on GitLab, and a\n`whsec_` key for the generic form.",
                            "properties": {
                              "key": {
                                "description": "The key.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "The Secret's name.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          }
                        },
                        "required": [
                          "secretRef"
                        ],
                        "type": "object"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": [
                  "builderRef",
                  "source"
                ],
                "type": "object",
                "x-kubernetes-validations": [
                  {
                    "message": "an archive source has no webhook trigger",
                    "rule": "!has(self.source.archive) || !has(self.triggers.webhook)"
                  }
                ]
              },
              "status": {
                "description": "What the controller knows about a `Build`.",
                "nullable": true,
                "properties": {
                  "baseImages": {
                    "description": "Base images of the newest successful build, `name@sha256:…`.",
                    "items": {
                      "maxLength": 1024,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "conditions": {
                    "description": "`SourceReady`, `BuilderReady` and `Ready`.",
                    "items": {
                      "description": "A status condition, as `metav1.Condition`.",
                      "properties": {
                        "lastTransitionTime": {
                          "description": "When the status last changed (RFC 3339).",
                          "format": "date-time",
                          "type": "string"
                        },
                        "message": {
                          "description": "A human-readable message.",
                          "maxLength": 32768,
                          "type": "string"
                        },
                        "observedGeneration": {
                          "description": "The `metadata.generation` the condition was computed from.",
                          "format": "int64",
                          "minimum": 0.0,
                          "nullable": true,
                          "type": "integer"
                        },
                        "reason": {
                          "description": "A `CamelCase` reason.",
                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        },
                        "status": {
                          "description": "`True`, `False` or `Unknown`.",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ],
                          "type": "string"
                        },
                        "type": {
                          "description": "`Ready`, `SourceReady` or `BuilderReady`.",
                          "maxLength": 316,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": [
                        "lastTransitionTime",
                        "reason",
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "exposedPorts": {
                    "description": "Ports the newest successful build's image declares in its `ExposedPorts`, as the image\nconfig writes them (`3000/tcp`, `53/udp`), sorted. Empty when it declares none.",
                    "items": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "lastBuildRunRef": {
                    "description": "The newest `BuildRun`.",
                    "maxLength": 253,
                    "nullable": true,
                    "type": "string"
                  },
                  "lastResolvedAt": {
                    "description": "When the ref was last resolved.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
                  "lastRunRevision": {
                    "description": "The revision the controller last created a `BuildRun` for. Deleting that run does not\nbuild the revision again.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "lastWebhookAt": {
                    "description": "When a webhook last woke this `Build`; written by the receiver only. Later than\n`lastResolvedAt`: the ref is asked again.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
                  "latestImage": {
                    "description": "Its image, `<repository>:<tag>@<digest>`.",
                    "maxLength": 1024,
                    "nullable": true,
                    "type": "string"
                  },
                  "latestRevision": {
                    "description": "The commit or archive digest of the newest successful build.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "observedGeneration": {
                    "description": "The generation last acted on.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "remoteRevision": {
                    "description": "The commit the ref points at, or the archive's digest.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "resolvedRef": {
                    "description": "The full name of the ref `remoteRevision` came from, such as `refs/heads/master` when\n`ref` is `HEAD`.",
                    "maxLength": 1024,
                    "nullable": true,
                    "type": "string"
                  },
                  "sourceMode": {
                    "description": "How the source is reached.",
                    "enum": [
                      "GitHubApp",
                      "PlainGit",
                      "Archive"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "uploadToken": {
                    "description": "The last upload token the controller issued, for the annotation\n`builder.zeabur.com/upload-token-request`.",
                    "nullable": true,
                    "properties": {
                      "expiresAt": {
                        "description": "When the token expires.",
                        "format": "date-time",
                        "type": "string"
                      },
                      "request": {
                        "description": "The annotation value it answers.",
                        "maxLength": 63,
                        "type": "string"
                      },
                      "secretName": {
                        "description": "The `kubernetes.io/dockerconfigjson` Secret, in the `Build`'s namespace. Its key `token`\nholds the bare token.",
                        "maxLength": 253,
                        "type": "string"
                      }
                    },
                    "required": [
                      "expiresAt",
                      "request",
                      "secretName"
                    ],
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "Build",
            "type": "object"
          }
        },
        "served": true,
