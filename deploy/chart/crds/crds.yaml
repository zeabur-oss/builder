                    "maxLength": 253,
                    "nullable": true,
                    "type": "string"
                  },
                  "cacheStats": {
                    "description": "Build steps and cache hits.",
                    "nullable": true,
                    "properties": {
                      "cached": {
                        "description": "Steps answered from cache.",
                        "format": "int64",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "total": {
                        "description": "Distinct steps.",
                        "format": "int64",
                        "minimum": 0.0,
                        "type": "integer"
                      }
                    },
                    "required": [
                      "cached",
                      "total"
                    ],
                    "type": "object"
                  },
                  "checkRunID": {
                    "description": "The GitHub check run.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "completionTime": {
                    "description": "When it finished.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
