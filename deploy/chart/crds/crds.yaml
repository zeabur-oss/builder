          },
          {
            "jsonPath": ".status.completionTime",
            "name": "Finished",
            "type": "date"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "One build of one Git commit or uploaded archive by Zeabur Builder.",
            "properties": {
              "spec": {
                "description": "One build of one commit or archive. The spec is immutable: to build again, create another.",
                "properties": {
                  "buildRef": {
                    "description": "The `Build`.",
                    "maxLength": 253,
                    "minLength": 1,
                    "type": "string"
                  },
                  "ref": {
                    "description": "The full name of the ref `revision` was resolved from, such as `refs/heads/master`.",
                    "maxLength": 1024,
                    "nullable": true,
                    "type": "string"
                  },
                  "revision": {
                    "description": "The full commit SHA of a Git source, or the manifest digest of an archive source.",
                    "maxLength": 71,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "trigger": {
                    "description": "What started a `BuildRun`.",
                    "enum": [
                      "webhook",
                      "poll",
                      "manual"
                    ],
                    "nullable": true,
                    "type": "string"
                  }
                },
                "required": [
                  "buildRef",
                  "revision"
                ],
                "type": "object",
