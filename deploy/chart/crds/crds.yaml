                    "items": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "imageDigest": {
                    "description": "The pushed manifest's digest.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^sha256:[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "jobRef": {
                    "description": "The Job.",
                    "maxLength": 253,
                    "nullable": true,
                    "type": "string"
                  },
                  "message": {
                    "description": "Details for people, at most 1 KiB from the Job.",
                    "maxLength": 4096,
                    "nullable": true,
                    "type": "string"
                  },
