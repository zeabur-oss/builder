                  {
                    "message": "a BuildRun's spec is immutable; create another",
                    "rule": "self == oldSelf"
                  }
                ]
              },
              "status": {
                "description": "Progress and result.",
                "nullable": true,
                "properties": {
                  "baseImages": {
