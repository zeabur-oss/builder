# The builders Zeabur offers. Builds name them in spec.builderRef.
apiVersion: builder.zeabur.com/v1alpha1
kind: ClusterBuilder
metadata:
  name: dockerfile
  labels: {{- include "builder.labels" . | nindent 4 }}
spec:
  type: dockerfile
  frontend: {type: dockerfile.v0}
---
apiVersion: builder.zeabur.com/v1alpha1
kind: ClusterBuilder
metadata:
  name: railpack
  labels: {{- include "builder.labels" . | nindent 4 }}
spec:
  type: railpack
  railpack:
    image: {{ include "builder.image" (list .Values.railpackImage .Chart) | quote }}
  frontend:
    type: gateway.v0
    source: {{ include "builder.pinnedImage" .Values.railpackFrontend | quote }}
{{- with .Values.agent }}
{{- if .enabled }}
---
apiVersion: builder.zeabur.com/v1alpha1
kind: ClusterBuilder
metadata:
  name: agent
  labels: {{- include "builder.labels" $ | nindent 4 }}
spec:
  type: agent
  agent:
    image: {{ include "builder.image" (list $.Values.jobImage $.Chart) | quote }}
    # The agent stops itself after 20 minutes.
    timeout: 25m
    model:
      provider: {{ required "agent.provider is required" .provider | quote }}
      model: {{ required "agent.model is required" .model | quote }}
      {{- with .baseUrl }}
      baseUrl: {{ . | quote }}
      {{- end }}
      {{- if not .auth.type }}
      {{- fail "agent.auth.type is required" }}
      {{- end }}
      auth: {{- toYaml .auth | nindent 8 }}
  frontend: {type: dockerfile.v0}
{{- end }}
{{- end }}
