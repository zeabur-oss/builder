# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Releases").
[package]
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "zeabur-builder" },
  { path = "Cargo.lock", dependency = "zeabur-builder-api" },
  { path = "Cargo.lock", dependency = "zeabur-builder-core" },
  { path = "Cargo.lock", dependency = "zeabur-builder-job" },
  { path = "Cargo.lock", dependency = "zeabur-builder-jobspec" },
  { path = "deploy/chart/Chart.yaml", regex = '(?m)^version: (?<version>\S+)$' },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
